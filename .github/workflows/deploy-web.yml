name: Deploy Web

# Tag-gated, mirroring xindeler-zuul's own deploy.sh convention (ZG-41): deploys are cut from
# `main` only via a versioned `vX.Y.Z` tag, `development` is never deployed directly. The
# "reachable from main" check below is the actual enforcement, not just the tag-push trigger --
# a tag pushed from any other branch is refused the same way deploy.sh refuses one.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

jobs:
  deploy:
    name: export and deploy to the VPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse to deploy anything not reachable from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${{ github.sha }}" origin/main || {
            echo "::error::${{ github.ref_name }} (${{ github.sha }}) is not reachable from main -- refusing to deploy"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Export the Web build
        run: npx expo export --platform web

      - name: Load the deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Sync to the VPS
        # No path after the trailing colon: the deploy key on the VPS side is installed with a
        # forced `rrsync -wo /opt/xindeler-zuul/web/` command (restricted-rsync-over-ssh), which
        # already chdirs into that exact directory and treats any destination path from the
        # client as *relative* to it. Passing the absolute path again here (as an earlier draft
        # of this workflow did) makes rrsync append it a second time --
        # "/opt/xindeler-zuul/web/opt/xindeler-zuul/web" -- which doesn't exist, and the transfer
        # fails outright. Confirmed against the real deploy key and a real rsync 3.2.7 on the VPS,
        # not assumed from the rrsync docs alone.
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_SSH_HOST }}" >> ~/.ssh/known_hosts
          rsync -avz --delete --safe-links \
            dist/ \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:"
