name: Deploy Web

# Tag-gated, mirroring xindeler-zuul's own deploy.sh convention (ZG-41): deploys are cut from
# `main` only via a versioned `vX.Y.Z` tag, `development` is never deployed directly. The
# "reachable from main" check below is the actual enforcement, not just the tag-push trigger --
# a tag pushed from any other branch is refused the same way deploy.sh refuses one. What MAJOR/
# MINOR/PATCH mean for this project: docs/reference/versioning.md.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

jobs:
  deploy:
    name: export and deploy to the VPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse to deploy anything not reachable from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${{ github.sha }}" origin/main || {
            echo "::error::${{ github.ref_name }} (${{ github.sha }}) is not reachable from main -- refusing to deploy"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Export the Web build
        run: npx expo export --platform web

      - name: Load the deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          # OC-86 (ZG-72): a dedicated key, not `VPS_SSH_KEY` -- that one's forced command on the
          # VPS side is restricted to `rrsync -wo /opt/xindeler-zuul/web/`, Zuul's own static-file
          # directory from when this app's Web build was served from `zuul.xindeler.com` (OC-38).
          # Now that it's served from its own origin (`overlord.xindeler.com`, ZG-72) at a
          # completely different path, a single SSH key's forced command can't cover both --
          # `OVERLORD_WEB_SSH_KEY` is a separate keypair whose forced command on the VPS is
          # restricted to `/srv/xindeler/overlord/public/` instead. Same host/user as before
          # (`VPS_SSH_HOST`/`VPS_SSH_USER`, unchanged) -- same server, same `mgrinberg` user,
          # confirmed by the Zuul session that provisioned the vhost, only the key differs.
          ssh-private-key: ${{ secrets.OVERLORD_WEB_SSH_KEY }}

      - name: Sync to the VPS
        # No path after the trailing colon: same reasoning as the old `VPS_SSH_KEY` setup this
        # replaces -- the deploy key on the VPS side is installed with a forced
        # `rrsync -wo /srv/xindeler/overlord/public/` command (restricted-rsync-over-ssh), which
        # already chdirs into that exact directory and treats any destination path from the
        # client as *relative* to it. Passing the absolute path again here makes rrsync append it
        # a second time -- confirmed as a real failure mode against the old target (OC-38), not
        # assumed from the rrsync docs alone.
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_SSH_HOST }}" >> ~/.ssh/known_hosts
          rsync -avz --delete --safe-links \
            dist/ \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:"
